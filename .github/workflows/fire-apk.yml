name: Fire TV APK

# Builds the launcher and publishes the APK as a download, so fire/install.sh can be run without a local
# Android SDK. Actions tab > latest "Fire TV APK" run > Artifacts > tvhome-fire.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../tvhome-fire.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-fire
          path: tvhome-fire.apk
